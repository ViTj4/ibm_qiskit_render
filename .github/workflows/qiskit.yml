name: Run Qiskit Hello World

on: [push, pull_request] # Exécute sur chaque push et PR

jobs:
  run-qiskit-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install system dependencies for Qiskit Aer
        run: sudo apt-get update && sudo apt-get install -y libomp-dev

      - name: Install Python dependencies
        run: pip install qiskit qiskit-aer qiskit-ibm-provider python-dotenv

      - name: Run Qiskit Hello World
        env:
          IBM_QISKIT_API_KEY: ${{ secrets.IBM_QISKIT_API_KEY }}
        run: python script.py
